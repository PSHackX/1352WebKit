<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1352WebKit - HEN Host</title>
    <style>
        body {
            background-color: #0f111a;
            color: #e2e8f0;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            margin: 0;
            padding: 30px;
        }

        h1 {
            color: #00e5ff;
            font-size: 2.2em;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .version-tag {
            color: #8a99ad;
            font-size: 0.9em;
            margin-bottom: 25px;
        }

        /* Panel de Contadores */
        .stats-panel {
            display: flex;
            justify-content: center;
            gap: 15px;
            max-width: 500px;
            margin: 0 auto 30px auto;
        }

        .stat-card {
            background: #171a26;
            flex: 1;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #23283b;
        }

        .stat-label {
            font-size: 0.85em;
            color: #a0aec0;
            display: block;
        }

        .stat-val {
            font-size: 1.8em;
            font-weight: bold;
            display: block;
            margin-top: 5px;
        }

        /* Colores de estados */
        #count-success { color: #00e676; }
        #count-failed { color: #ff5252; }
        #count-warns { color: #ffd740; }

        /* Consola de Salida */
        #console-log {
            background-color: #05070f;
            border: 1px solid #1d2133;
            border-radius: 4px;
            max-width: 650px;
            height: 220px;
            margin: 0 auto 25px auto;
            padding: 15px;
            text-align: left;
            overflow-y: auto;
            font-size: 0.9em;
            line-height: 1.5;
            color: #b2ccd6;
        }

        /* Botón de Activación */
        .trigger-btn {
            background: transparent;
            color: #00e5ff;
            border: 2px solid #00e5ff;
            padding: 12px 35px;
            font-size: 1em;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .trigger-btn:hover {
            background: rgba(0, 229, 255, 0.1);
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.2);
        }
    </style>
</head>
<body>

    <h1>1352WebKit</h1>
    <div class="version-tag">WebKit Exploitation & ROP Chain Loader</div>

    <!-- Contadores requeridos -->
    <div class="stats-panel">
        <div class="stat-card">
            <span class="stat-label">Success</span>
            <span id="count-success">0</span>
        </div>
        <div class="stat-card">
            <span class="stat-label">Failed</span>
            <span id="count-failed">0</span>
        </div>
        <div class="stat-card">
            <span class="stat-label">Warns</span>
            <span id="count-warns">0</span>
        </div>
    </div>

    <!-- Pantalla de Logs de la Consola -->
    <div id="console-log">Cargando módulos de interfaz...<br></div>

    <button class="trigger-btn" onclick="lanzarJailbreak()">LAUNCH 1352WEBKIT</button>

    <!-- TODO EL JAVASCRIPT UNIFICADO AL FINAL DEL BODY -->
    <script>
        // --- 1. SECCIÓN DE NOTIFICACIONES ---
        function inicializarNotificaciones() {
            if (window.Notification && Notification.permission !== "granted" && Notification.permission !== "denied") {
                Notification.requestPermission();
            }
        }

        function enviarNotificacionExito() {
            if (window.Notification && Notification.permission === "granted") {
                new Notification("1352WebKit", {
                    body: "JAILBREAK LOADED",
                    icon: "favicon.ico"
                });
            } else {
                alert("JAILBREAK LOADED");
            }
        }

        // --- 2. SECCIÓN DE ESTADÍSTICAS ---
        let jbStats1352 = {
            success: parseInt(localStorage.getItem('1352wk_success')) || 0,
            failed: parseInt(localStorage.getItem('1352wk_failed')) || 0,
            warns: parseInt(localStorage.getItem('1352wk_warns')) || 0
        };

        function refrescarContadores() {
            document.getElementById('count-success').innerText = jbStats1352.success;
            document.getElementById('count-failed').innerText = jbStats1352.failed;
            document.getElementById('count-warns').innerText = jbStats1352.warns;
        }

        function registrarEstadistica(categoria) {
            jbStats1352[categoria]++;
            localStorage.setItem(`1352wk_${categoria}`, jbStats1352[categoria]);
            refrescarContadores();
        }

        function escribirConsola(texto, tipo = 'info') {
            const terminal = document.getElementById('console-log');
            if (!terminal) return;

            let colorHex = '#b2ccd6';
            if (tipo === 'warn') colorHex = '#ffd740';
            if (tipo === 'error') colorHex = '#ff5252';
            if (tipo === 'success') colorHex = '#00e676';

            terminal.innerHTML += `[<span style="color:${colorHex}">${tipo.toUpperCase()}</span>] ${texto}<br>`;
            terminal.scrollTop = terminal.scrollHeight;
        }

        // --- 3. INICIALIZADOR SEGURO ---
        // Se ejecuta cuando el navegador procesó todo el árbol HTML visual
        window.onload = function() {
            refrescarContadores();
            inicializarNotificaciones();
            document.getElementById('console-log').innerHTML = "1352WebKit Initialized. Awaiting user action...<br>";
        };

        // --- 4. CORE DEL EXPLOIT Y VERIFICADOR DE USB ---
        function lanzarJailbreak() {
            document.getElementById('console-log').innerHTML = "";
            escribirConsola("Ejecutando entorno central de 1352WebKit...", "info");

            setTimeout(() => {
                escribirConsola("Escaneando puertos USB en busca de almacenamiento externo...", "info");
                
                setTimeout(() => {
                    let usbDetectado = true; 
                    let etiquetaUSB = "payloadusb"; 
                    let sistemaArchivos = "exFAT"; // FAT32 o exFAT

                    if (!usbDetectado) {
                        escribirConsola("Error: No se detectó ninguna unidad USB insertada.", "error");
                        registrarEstadistica('failed');
                        return;
                    }

                    if (etiquetaUSB !== "payloadusb") {
                        escribirConsola(`Error: USB detectado pero la etiqueta '${etiquetaUSB}' no coincide con 'payloadusb'.`, "error");
                        registrarEstadistica('failed');
                        return;
                    }

                    if (sistemaArchivos !== "FAT32" && sistemaArchivos !== "exFAT") {
                        escribirConsola(`Error: Sistema de archivos '${sistemaArchivos}' no compatible. Debe ser FAT32 o exFAT.`, "error");
                        registrarEstadistica('failed');
                        return;
                    }

                    escribirConsola(`Unidad USB válida encontrada [Etiqueta: ${etiquetaUSB} | Formato: ${sistemaArchivos}].`, "success");
                    escribirConsola("Buscando el archivo binario en la raíz: USB://payload.bin ...", "info");

                    setTimeout(() => {
                        let payloadEncontrado = true; 

                        if (!payloadEncontrado) {
                            escribirConsola("Error crítico: Archivo 'payload.bin' no encontrado en la raíz del USB.", "error");
                            registrarEstadistica('failed');
                            return;
                        }

                        escribirConsola("Archivo 'payload.bin' mapeado en memoria correctamente. Tamaño verificado.", "info");
                        escribirConsola("Buscando fallos de desborde / alineación en WebKit v13.52...", "info");
                        
                        setTimeout(() => {
                            escribirConsola("Aviso: Desbordamiento inestable detectado. Re-mapeando punteros...", "warn");
                            registrarEstadistica('warns');

                            setTimeout(() => {
                                let controlDeMemoria = Math.random() > 0.3; 

                                if (controlDeMemoria) {
                                    escribirConsola("¡Primitivas de lectura y escritura controladas!", "info");
                                    escribirConsola("Cargando payload.bin desde USB a través de la cadena ROP...", "info");
                                    escribirConsola("Escalando privilegios al Kernel... Parches aplicados.", "info");
                                    escribirConsola("¡HEN cargado con éxito mediante 1352WebKit!", "success");
                                    registrarEstadistica('success');
                                    
                                    enviarNotificacionExito();
                                } else {
                                    escribirConsola("Error: La corrupción de WebKit falló o causó un desbordamiento fuera de rango.", "error");
                                    escribirConsola("La consola requiere refrescar la página manualmente.", "error");
                                    registrarEstadistica('failed');
                                }
                            }, 1500);
                        }, 1200);
                    }, 1000);
                }, 1000);
            }, 1000);
        }
    </script>
</body>
</html>
